global:
  request_delay_min: 1.5        # seconds between requests (min)
  request_delay_max: 3.0        # seconds between requests (max)
  max_retries: 3
  timeout: 15
  output_dir: "../datasets/raw/hindi_scraper_output"
  db_path: "../datasets/raw/hindi_scraper_output/hindi_news.db"
  log_file: "../datasets/raw/hindi_scraper_output/scraper.log"

sites:
  bhaskar:
    name: "Dainik Bhaskar"
    base_url: "https://www.bhaskar.com"
    enabled: true
    delay: 2.0
    categories:
      - url: "https://www.bhaskar.com/national/"
        name: "national"
      - url: "https://www.bhaskar.com/state/"
        name: "state"
      - url: "https://www.bhaskar.com/business/"
        name: "business"
      - url: "https://www.bhaskar.com/sports/"
        name: "sports"
      - url: "https://www.bhaskar.com/tech-auto/"
        name: "technology"
      - url: "https://www.bhaskar.com/entertainment/"
        name: "entertainment"
    selectors:
      article_links: "a.story-link, a[href*='/news/'], article a"
      headline: "h1.story-title, h1[class*='headline'], h1"
      body: "div.story-detail, div[class*='story-content'], article p"
      author: "span.author-name, span[class*='author'], a[class*='author']"
      date: "span.story-date, time, span[class*='date']"
      category: "span.breadcrumb a, nav.breadcrumb a"
      tags: "div.tags a, ul.tags li a"
    pagination:
      type: "load_more_url"
      param: "page"

  amarujala:
    name: "Amar Ujala"
    base_url: "https://www.amarujala.com"
    enabled: true
    delay: 2.0
    categories:
      - url: "https://www.amarujala.com/india-news"
        name: "india"
      - url: "https://www.amarujala.com/business"
        name: "business"
      - url: "https://www.amarujala.com/sports"
        name: "sports"
      - url: "https://www.amarujala.com/technology"
        name: "technology"
      - url: "https://www.amarujala.com/entertainment"
        name: "entertainment"
      - url: "https://www.amarujala.com/world"
        name: "world"
    selectors:
      # AU articles have date-suffixed slugs e.g. /india-news/slug-2026-08-13
      # ?src= links are navigation, not articles — filtered in Python by checking absence of ?src=
      article_links: "h2 a, h3 a, a.list-title, a[href*='-news'], a[href*='-2026-']"
      headline: "h1.detail-title, h1[itemprop='headline'], h1"
      body: "div.detail-body p, div[class*='article-body'] p, article p"
      author: "span.author a, span[class*='reporter'], a[rel='author']"
      date: "time[datetime], span.publish-date, span[class*='date']"
      category: "div.breadcrumb a, span.section-name"
      tags: "div.tag-list a, ul.article-tags a"

  navbharat:
    name: "Navbharat Times"
    base_url: "https://navbharattimes.indiatimes.com"
    enabled: true
    delay: 2.5
    categories:
      # Correct articlelist URLs discovered from live site navigation
      - url: "https://navbharattimes.indiatimes.com/india/articlelist/1564454.cms"
        name: "india"
      - url: "https://navbharattimes.indiatimes.com/business/articlelist/2279786.cms"
        name: "business"
      - url: "https://navbharattimes.indiatimes.com/sports/articlelist/2279790.cms"
        name: "sports"
      - url: "https://navbharattimes.indiatimes.com/tech/articlelist/19615041.cms"
        name: "technology"
      - url: "https://navbharattimes.indiatimes.com/entertainment/articlelist/2279793.cms"
        name: "entertainment"
      - url: "https://navbharattimes.indiatimes.com/world/articlelist/2279801.cms"
        name: "world"
    selectors:
      # NBT is SSR; article links contain /articleshow/ — broad selectors for robust matching
      article_links: "a[href*='/articleshow/'], h2 a, h3 a, figure a, div.list_wrap a"
      headline: "h1.article_title, h1[class*='artTitle'], h1[class*='title'], h1"
      body: "div.article_content p, div[class*='articlestorycontent'] p, div.artText p, article p"
      author: "span.author, span[class*='author'], a[class*='auth'], div.author-name"
      date: "span[class*='date'], time[datetime], time, div[class*='date']"
      category: "div.breadcrumb a, nav.breadcrumb a, span.section"
      tags: "div.tags a, ul.tag_list li a"

  hindustan:
    name: "Hindustan"
    base_url: "https://www.livehindustan.com"
    enabled: true
    delay: 2.0
    categories:
      - url: "https://www.livehindustan.com/national"
        name: "national"
      - url: "https://www.livehindustan.com/business"
        name: "business"
      - url: "https://www.livehindustan.com/sports"
        name: "sports"
      - url: "https://www.livehindustan.com/technology"
        name: "technology"
      - url: "https://www.livehindustan.com/entertainment"
        name: "entertainment"
      - url: "https://www.livehindustan.com/uttar-pradesh"
        name: "uttar-pradesh"
      - url: "https://www.livehindustan.com/bihar"
        name: "bihar"
    selectors:
      # livehindustan.com article URLs end in 15-digit-ID.html — Python-side filter handles this
      # Broad selectors to catch all anchor tags; Python will filter by URL pattern
      article_links: "a"
      headline: "h1.hdg1, h1[class*='title'], h1"
      body: "div.detail-body p, div[class*='story-details'] p, article p"
      author: "span.reporter a, span[class*='author'], a.reporter-name"
      date: "span.lastupdated, time[datetime], span[class*='pubdate']"
      category: "nav.breadcrumbs a, div.breadcrumb a"
      tags: "div.topics a, ul.tag-list li a"

  patrika:
    name: "Patrika"
    base_url: "https://www.patrika.com"
    enabled: true
    delay: 2.0
    categories:
      - url: "https://www.patrika.com/national-news/"
        name: "national"
      - url: "https://www.patrika.com/business/"
        name: "business"
      - url: "https://www.patrika.com/sports-news/"
        name: "sports"
      - url: "https://www.patrika.com/technology/"
        name: "technology"
      - url: "https://www.patrika.com/entertainment/"
        name: "entertainment"
      - url: "https://www.patrika.com/world-news/"
        name: "world"
    selectors:
      article_links: "a"
      headline: "h1.article-title, h1[class*='headline'], h1"
      body: "div.article-content p, div[class*='story-body'] p, div.content-area p"
      author: "span.author-name, span[class*='author'], a.author"
      date: "span.publish-date, time[datetime], span[class*='time']"
      category: "div.breadcrumb a, span.category-name"
      tags: "div.tags a, ul.article-tags li a"
